name: flightwall_app
description: Tablet dashboard for live flights overhead, an unofficial companion to TheFlightWall.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flightwall_core:
    path: ../packages/flightwall_core
  flutter_map: ^8.3.2
  flutter_secure_storage: ^11.2.0
  http: ^1.6.0
  latlong2: ^0.10.1
  shared_preferences: ^2.5.6
  wakelock_plus: ^1.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
